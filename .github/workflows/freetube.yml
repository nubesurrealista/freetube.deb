# This is a basic workflow to help you get started with Actions
name: Freetube
# Controls when the workflow will run
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}
jobs:
  update:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    env:
      PUSH: 1
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: GPG user IDs
        run: |
          echo "fingerprint: ${{ steps.import_gpg.outputs.fingerprint }}"
          echo "keyid: ${{ steps.import_gpg.outputs.keyid }}"
          echo "name: ${{ steps.import_gpg.outputs.name }}"
          echo "email: ${{ steps.import_gpg.outputs.email }}"
      # Runs a set of commands using the runners shell
      - name: Install dependencies
        run: |
          sudo apt install reprepro
      - name: Check Update
        run: |
          function update_repo() {
            ver=$(echo "$1" | tr -d 'v' | tr '-' '_') # For download (e.g., 0.23.6_beta)
            repo_ver=$(echo "$1" | tr -d 'v' | cut -d '-' -f 1) # For repo (e.g., 0.23.6)
            echo "DEBUG: Updating repo with version $ver, repo version $repo_ver"
            echo "DEBUG: Current directory: $(pwd)"
            echo "DEBUG: Files in current directory: $(ls -l)"
            echo "DEBUG: Checking for freetube_${ver}_amd64.deb: $(ls -l freetube_${ver}_amd64.deb || echo 'Not found')"
            reprepro --basedir "$(pwd)/meta" includedeb stable "./freetube_${ver}_amd64.deb"
            if [ $? -eq 0 ]; then
              echo "DEBUG: reprepro includedeb successful"
            else
              echo "DEBUG: reprepro includedeb failed"
              exit 1
            fi
            echo "DEBUG: Directory structure after reprepro: $(find . -type f)"
            if [ -d dists ]; then rm -r dists; echo "DEBUG: Removed dists directory"; fi
            if [ -d pool ]; then rm -r pool; echo "DEBUG: Removed pool directory"; fi
            mv meta/dists ./
            mv meta/pool ./
            echo "DEBUG: Checking for pool/main/f/freetube/freetube_${repo_ver}_amd64.deb: $(ls -l pool/main/f/freetube/freetube_${repo_ver}_amd64.deb || echo 'Not found')"
            checksum_amd64=$(sha256sum pool/main/f/freetube/freetube_${repo_ver}_amd64.deb)
            if [ $? -eq 0 ]; then
              echo "DEBUG: Checksum for amd64: $checksum_amd64"
            else
              echo "DEBUG: sha256sum failed"
              exit 1
            fi
            sed -i -E "s,[a-f0-9]{64}[ ]+pool/main/f/freetube/freetube_[0-9]\.[0-9]+\.[0-9](_beta)?_amd64.deb,$checksum_amd64," README.md
            if [ $? -eq 0 ]; then
              echo "DEBUG: README.md updated successfully"
            else
              echo "DEBUG: Failed to update README.md"
              exit 1
            fi
            echo "PUSH=0" >> $GITHUB_ENV
            echo "DEBUG: Set PUSH=0"
          }
         
          function download_update() {
            if [ -f /tmp/verify.log ]; then rm /tmp/verify.log; echo "DEBUG: Removed verify.log"; fi
            ver=$(echo "$1" | tr -d 'v' | tr '-' '_') # Replace - with _ for beta suffix
            url="https://github.com/FreeTubeApp/FreeTube/releases/download/$1/freetube_${ver}_amd64.deb"
            echo "DEBUG: Attempting to download version $ver from $url"
            wget -q "$url" --show-progress 2> /tmp/wget_error.log
            if [ "$?" -eq "0" ]; then
              echo 'amd64 downloaded'
              echo "DEBUG: Download successful for $1"
              echo "$1" > last_update
              echo "DEBUG: Wrote $1 to last_update"
              echo "DEBUG: Downloaded file: $(ls -l freetube_${ver}_amd64.deb || echo 'Not found')"
              return 0
            else
              echo "DEBUG: Download failed for $1"
              echo "DEBUG: wget error: $(cat /tmp/wget_error.log)"
              return 1
            fi
          }
         
          function compare() {
            last_ver=$(echo "$1" | tr -d 'v')
            latest_ver=$(echo "$2" | tr -d 'v')
            last_big=$(echo "$last_ver" | cut -d "." -f 1)
            last_medium=$(echo "$last_ver" | cut -d "." -f 2)
            last_small=$(echo "$last_ver" | cut -d "." -f 3 | cut -d "-" -f 1)
            latest_big=$(echo "$latest_ver" | cut -d "." -f 1)
            latest_medium=$(echo "$latest_ver" | cut -d "." -f 2)
            latest_small=$(echo "$latest_ver" | cut -d "." -f 3 | cut -d "-" -f 1)
            echo "DEBUG: Comparing versions: last_ver=$last_ver ($last_big.$last_medium.$last_small) vs latest_ver=$latest_ver ($latest_big.$latest_medium.$latest_small)"
            if [ "$latest_big" -gt "$last_big" ]; then
                echo "DEBUG: Update needed (major version)"
                return 0
            elif [ "$latest_big" -eq "$last_big" ] && [ "$latest_medium" -gt "$last_medium" ]; then
                echo "DEBUG: Update needed (medium version)"
                return 0
            elif [ "$latest_big" -eq "$last_big" ] && [ "$latest_medium" -eq "$last_medium" ] && [ "$latest_small" -gt "$last_small" ]; then
                echo "DEBUG: Update needed (minor version)"
                return 0
            fi
            echo "DEBUG: No update needed"
            return 1
          }
         
          echo 'Checking update...'
          echo "DEBUG: Fetching releases from freetubeapp.io"
          releases=$(wget -qO- https://freetubeapp.io/#download | grep -o 'https://github.com/FreeTubeApp/FreeTube/releases/download/.*/freetube_.*_amd64.deb')
          echo "DEBUG: Releases found: $releases"
          latest=$(echo "$releases" | egrep -o 'v[0-9]+\.[0-9]+\.[0-9]+(-beta)?' | head -n 1)
          echo "DEBUG: Latest version detected: $latest"
          echo "PUSH=1" >> $GITHUB_ENV
          echo "DEBUG: Set PUSH=1"
          if [ -f 'last_update' ]; then
              last_update=$(cat last_update)
              echo "DEBUG: Last update from file: $last_update"
              if compare "$last_update" "$latest"; then
                echo 'Update available, downloading latest deb'
                if download_update "$latest"; then
                  echo "DEBUG: Calling update_repo for $latest"
                  update_repo "$latest"
                else
                  echo "DEBUG: download_update failed"
                fi
              else
                echo 'No update available'
                echo "DEBUG: compare returned false, no update needed"
              fi
          else
            echo 'No version file found, assuming update available'
            echo "DEBUG: No last_update file, proceeding with download"
            if download_update "$latest"; then
              echo "DEBUG: Calling update_repo for $latest (no last_update)"
              update_repo "$latest"
            else
              echo "DEBUG: download_update failed (no last_update)"
            fi
          fi
          echo "DEBUG: Final PUSH value: $PUSH"
      - name: Commit repo changes
        if: ${{ env.PUSH == 0 }}
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ GITHUB.REPOSITORY }}
          git status
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add last_update dists pool README.md
          git commit -m "Update packages"
          git push
